<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="250" rx="8" fill="#0b0f10" stroke="#1f2937" stroke-width="1"/>
  
  <!-- macOS window controls -->
  <circle cx="20" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="20" r="5" fill="#22c55e"/>
  
  <text x="450" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">azthee1@github: ~$ ./wordmark.sh --name</text>
  <text x="880" y="240" fill="#1f2937" font-family="monospace" font-size="10" text-anchor="end">gitskins.com</text>
  
  <!-- Moving Group -->
  <g clip-path="url(#reveal)">
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="250">
        <!-- Typing reveal effect -->
        <animate attributeName="width" values="0;900;900" dur="4s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <text x="50" y="80" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`         SS`   SSSSSSS+++`                  SSSSSSSSSSSSS`` SSSSSSSSSSSSS`  SS`       SS``   SSSSSSS``     SSSSSSSSSSSSS`` </text>
    <text x="50" y="92" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`SS`   SSSSS`   SS`+++++++=SS`               ++++++++++++S`` ++++++SSS+++++``SS`       SS``   ++++++++``    SSS++++++++++++`</text>
    <text x="50" y="104" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`++`SS`=++SS`   SS`        SS`               ++++++++++++S``  ++++++S``++++= SS`       SS`` SS`+++++++=``   SS`++++++++++=S``</text>
    <text x="50" y="116" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`  ++`    SS`   SS`        SS`                       SS`++`         SS``     SSS+++++++S``  SS`      SS``   SS`          SS``</text>
    <text x="50" y="128" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`  =+=    SS`   SS`        SS`                       SS`++=         SS``     SSS+++++++S``  SSSSSSSSSSSSS`` SS`          SS``</text>
    <text x="50" y="140" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`         SS`   SS`        SS`                       SS`++`         SS``     SS`       SS`` SS`++++++++++`` SS`          S```</text>
    <text x="50" y="152" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`         SS`   SS`        SS`                       ++`            SS``     SS`       SS`` SS`        SS`` SS`          SS``</text>
    <text x="50" y="164" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`         SS`   SS`        SS`   SSSSS`              SS`++=         SS``     SS`       SS`` SS`        SS`` SS`          S++`</text>
    <text x="50" y="176" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">SS`         SS`   SS`SSSSSSS`++`   SSSSS`              SS`SSSSSSSSS`` SSSSSSSS`SSSS``SS`       SS`` SS`        SS`` SS`SSSSSSS`++=</text>
    <text x="50" y="188" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">++`         ++`   +++++++++++`     +++++`              +++++++++++++` ++++++++++++++`++`       +++` +++`       +++` +++++++++++`</text>
    <text x="50" y="200" fill="#e2e8f0" font-family="monospace" font-size="10" xml:space="preserve">=+=         ++=   +++++++++++      +++++=                                                                                       </text>

    <!-- Slow hover/parallax movement -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 10,0; -10,0; 0,0" dur="8s" repeatCount="indefinite" />
  </g>
  
  <!-- Glowing scanline sweeping up and down -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#34d399" stroke-width="2" opacity="0.3">
    <animate attributeName="y1" values="40;250;40" dur="4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="40;250;40" dur="4s" repeatCount="indefinite" />
  </line>
</svg>